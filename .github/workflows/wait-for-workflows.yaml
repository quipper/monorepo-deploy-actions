name: wait-for-workflows

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}--${{ github.ref }}
  cancel-in-progress: true

jobs:
  wait-for-workflows:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: int128/wait-for-workflows-action@30773005c6cb51df47a6b3d85fc8602fcf717894 # v1.111.0
