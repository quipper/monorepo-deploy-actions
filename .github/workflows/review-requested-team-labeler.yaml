name: review-requested-team-labeler

on:
  pull_request:
    types: [review_requested]

concurrency:
  group: ${{ github.workflow }}--${{ github.ref }}
  cancel-in-progress: true

jobs:
  add-label:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    # Trigger only when a team is requested for review
    if: |
      github.event.requested_team.name != null
    permissions:
      pull-requests: write
    steps:
      - uses: int128/label-action@90503f6bb517c831a74fac7af3fad60b03d1fe96 # v1.50.0
        with:
          add-labels: |
            review-requested-team:${{ github.event.requested_team.name }}
