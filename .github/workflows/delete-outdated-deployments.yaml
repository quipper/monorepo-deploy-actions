name: delete-outdated-deployments

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/delete-outdated-deployments.yaml

concurrency:
  group: ${{ github.workflow }}--${{ github.ref }}
  cancel-in-progress: true

jobs:
  delete:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      deployments: write
    steps:
      - uses: int128/delete-deployments-action@c4ddc18e58659ab40e5ad27a12539e2085bb8296 # v1.72.0
