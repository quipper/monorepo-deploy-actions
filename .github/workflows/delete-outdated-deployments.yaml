name: delete-outdated-deployments

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/delete-outdated-deployments.yaml

concurrency:
  group: ${{ github.workflow }}--${{ github.ref }}
  cancel-in-progress: true

jobs:
  delete:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      deployments: write
    steps:
      - uses: int128/delete-deployments-action@96f974af61959872315f9568ebc7fa72aa18ddec # v1.71.0
